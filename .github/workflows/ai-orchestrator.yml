name: AI Orchestrator

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  issue_comment:
    types:
      - created
  pull_request_review:
    types:
      - submitted
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-orchestrator-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  orchestrate:
    name: Route AI review events
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          CLAUDE_BRIDGE_URL: ${{ secrets.CLAUDE_BRIDGE_URL }}
          CLAUDE_BRIDGE_TOKEN: ${{ secrets.CLAUDE_BRIDGE_TOKEN }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
        run: python -m orchestrator
